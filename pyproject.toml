[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdb2027"
version = "0.1.0"
description = "NFL Big Data Bowl 2027 research pipeline: The Cost of a Cut"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "PyYAML>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebook = ["nbformat>=5", "nbclient>=0.10", "nbconvert>=7", "ipykernel>=6"]

[project.scripts]
bdb2027 = "bdb2027.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
